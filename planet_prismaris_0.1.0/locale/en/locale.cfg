[space-location-description]
prismaris=A world of perpetual storms and chaotic lakes of boiling liquid entropy. Resources are infinite, but ever-shifting. The wind and lightning seem unnaturally hostile to robots, though it's not impossible to use them there.
prismaris-stargate=Precursor technology. This extradimensional wormhole leads back home to the Calidus system.
prismaris-calidus-stargate=Precursor technology. This extradimensional wormhole sits in orbit around Gleba. It leads to another star system.


