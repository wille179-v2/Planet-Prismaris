[mod-setting-description]
prismaris-entropy-eye-strain-accessibility=The Entropic sea visually resembles TV-static, which may be unpleasant to some people. Enabling this setting replaces that with a flat gray texture that is easier on the eyes.
prismaris-easy-labs-ignore-spoil-percent=Normally, the freshness of a science pack determines how much research it contributes towards. This setting makes labs treat polyphasic science packs as if they were always 100% fresh.
prismaris-lightning-mercy=Lightninng on Prismaris is strongly attracted to robots, and logistics robots may even be struck despite being near lightning rods (lightning collectors still provide full protection). Enabling this setting makes lightning stop actively targeting your robots, but increases their energy usage from 2x to 4x instead.
prismaris-aether-mercy=By default, some variants of the shattered aether crystal are hidden in the circuit/filter UI and factoriopedia. Enabling this setting makes all variants fully visible and adjusts tooltips for better readability.
prismaris-dust-mode=Determines how Entropic dust behaves when burned or used in a recipe. Changing this setting may require you to redesign parts of your factory.
prismaris-rock-candy=Determines the properties of [item=prismaris-aethric-shard].
prismaris-spoil-speed=Adjusts the speed at which all Prismaris items spoil without altering the global spoil rate. This can be safely changed at any time.
prismaris-add-polysci-to-endgame=Polyphasic science packs are required for Aquilo technology and beyond. Some modpacks may overwrite this setting for compatibility.
prismaris-science-phase=Determines how polyphasic sciences is added to endgame sciences. Has no effect if "Add polyphasic science to endgame research" is disabled. Some modpacks may overwrite this setting for compatibility.
prismaris-stasis-removal=Removes the stasis mode of the chronocycler; useful if another mod adds its own way of preserving items that spoil, such as Corrundum's ice box or Apia-Carnova's lymph-based refreshing, and you don't want to double-up.
test-stasis-mode=For alpha-testing only. Toggles between two different modes of functionality for the Chronocycler in stasis mode. Changing this setting may cause preserved items to vanish.
test-reversal-mode=For alpha-testing only. Toggles between two different modes of functionality for the Chronocycler in reversal mode. For most items, this has no effect; it only changes the result of putting spoilage and similar post-spoil items into a chronocycler.

