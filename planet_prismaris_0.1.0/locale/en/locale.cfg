[tips-and-tricks-item-description]
planet-prismaris-briefing=[planet=prismaris] is a world of constant lightning storms and frothing liquid entropy dotted with small islands of solid land.\n[entity=prismaris-cultivated-aether-crystal], [entity=prismaris-prismatic-shard], [entity=prismaris-void-essence-well], and [tile=prismaris-entropic-sea] can all be combined to provide an infinite supply of all basic resources. However, all processes involve cyclical production chains and constantly-changing resources.
hostile-atmosphere=Lightning on [planet=prismaris] is similar to the lightning on [planet=fulgora]. However, there are a few notable differences:\n- Lightning strikes all day and night, but strikes less often on average and thus provides less power.\n- Lightning will occasionally ignore [entity=lightning-rod] to target [entity=construction-robot] and [entity=logistic-robot], becoming even more hostile with every added [entity=roboport] (this can be disabled in settings).\n- [entity=lightning-collector] provides much better protection, but must be imported from Fulgora.\n- Robots from your [item=personal-roboport-equipment] are not exempt, but will not be targeted if you are not standing too close to a roboport.\n\nAdditionally, robots use 2x energy flying in Prismaris's windy atmosphere. If hostile lightning is disabled, this energy usage increases to 4x instead.
prismatic-shards=[item=prismaris-prismatic-shard] can be separated into eight possible different shards using the [entity=prismaris-crystal-separator], always producing two shards at a time, one from each cycle.\nEach shard is from either the Red-Green-Blue-White ([color=#ff0000]R[/color][color=#00ff00]G[/color][color=#0000ff]B[/color][color=#ffffff]W[/color]) cycle or the Cyan-Yellow-Magenta-Black ([color=#00ffff]C[/color][color=#ff00ff]M[/color][color=#ffff00]Y[/color][color=#000000][font=white-border]K[/font][/color]) cycle. Over time, each shard spoils into the next stage in the cycle before repeating.\n[recipe=prismaris-shard-illumination] and [recipe=prismaris-shard-obscuring] can convert shards from one cycle into the other.\nRed, blue, green, cyan, yellow, and magenta can be combined to eventually produce [item=iron-ore], [item=copper-ore], and [item=stone].
aehtric-shards=[item=prismaris-aethric-shard] can be harvested from [entity=prismaris-cultivated-aether-crystal] and separated into shattered aethric shards. These shards have a rapid six-stage lifecycle, but the stages are nearly indistinguishable making them difficult to sort.\nEach stage can produce a different resource when processed in your choice of the [entity=prismaris-crystal-separator], [entity=prismaris-thermal-flux-furnace] or [entity=biochamber]. The cycle produces resources in this order:\n- [item=calcite]\n- [item=coal]\n- [item=carbon]\n- [item=solid-fuel]\n- [item=jelly]\n- [item=yumako-mash].\n\nOnly [item=prismaris-shattered-aethric-shard-f] can be replanted using an [entity=agricultural-tower].\n\nThere is a setting to assist in distinguishing the shards in mod settings.
entropic-sea=[tile=prismaris-entropic-sea] is a source of [fluid=prismaris-liquid-entropy]. It destroys items thrown into it like [tile=lava], but otherwise acts like [tile=water].\n\n[tile=prismaris-solidified-entropy] can be placed on the Entropic sea.\n\nIf the appearance of the Entropic sea is distracting, there is an accessibility option to reduce eye strain in mod settings.
entropic-dust=[fluid=prismaris-liquid-entropy] can be filtered into entropic dust and [fluid=water] in an [entity=chemical-plant].\n\nEntropic dust comes in four forms:\n[item=prismaris-raw-entropic-dust-positive] and [item=prismaris-raw-entropic-dust-negative] cycle back and forth over time.\n[item=prismaris-refined-entropic-dust-positive] can be made in a furnace and cycles to [item=prismaris-refined-entropic-dust-negative] if it spoils or back to [item=prismaris-raw-entropic-dust-negative] if burned as fuel or consumed in a recipe.\n\nOnly the positive forms are useful in recipes. \n\nClever applications of productivity can cause entropic dust to spontaneously multiply from nothing.
entropic-nutrients=[item=prismaris-entropic-nutrients] can be used to feed [entity=biochamber]. It spoils back into [item=prismaris-refined-entropic-dust-negative] or burns back into [item=prismaris-raw-entropic-dust-negative], both of which can eventually be re-processed into more entropic nutrients for a self-sustaining nutrient supply. Entropic nutrients cannot substitute for [item=nutrients] in crafting recipes, however.
void-essence=[fluid=prismaris-raw-void-essence] can be refined into [fluid=prismaris-concentrated-void-essence].\n\nAll recipes that use it as an ingredient and all machines that burn it as a fuel return 80% of its volume as [fluid=prismaris-distorted-void-essence]. Distorted void essence can be processed into [fluid=prismaris-stabilized-void-essence] and back to [fluid=prismaris-concentrated-void-essence], losing 20% of its volume each step.\n\nIf productivity at each step exceeds an average of 25%, void essence will be spontaneously produced from nothing, which may be useful or may be problematic depending on your needs.
flux-capacitor=The flux capacitor is a critical component in much of [planet=prismaris]'s technology and when creating  [item=prismaris-red-polyphasic-science-pack], [item=prismaris-green-polyphasic-science-pack], & [item=prismaris-blue-polyphasic-science-pack].\n\nIt is crafted as a [item=prismaris-charging-flux-capacitor], but you must wait until it becomes a [item=prismaris-active-flux-capacitor] to use it in crafting. If the short window of time passes, it will become a [item=prismaris-discharged-flux-capacitor] and must be manually reset to its charging state before it can be used.\n\nTiming is critical.
chronocycling=The [item=prismaris-unconfigured-chronocycler] can be configured into the [item=prismaris-acceleration-chronocycler], [item=prismaris-stasis-chronocycler], & [item=prismaris-reversal-chronocycler]. If not placed down, those items eventually unconfigure.\n\n All versions of the chronocycler consume [fluid=prismaris-concentrated-void-essence] as fuel and return 80% of its volume as [fluid=distorted-void-essence]. Productivity does not change this ratio here.
chronocycler-stasis=The [entity=prismaris-stasis-chronocycler] preserves items that can spoil. Its function can be tweaked in mod settings.\n- In "Refresh" mode, it resets the spoil time back to 100%.\n- In "Freeze" mode, it dramatically extends the spoil time of an item, but maintains the current spoil percentage. Frozen items must be un-frozen before they can be used.
chronocycler-acceleration=The [entity=prismaris-acceleration-chronocycler] forces items that can spoil to instantly spoil. When used on Prismaris or with other cyclically-spoiling items from other mods, this can be used to fast-forward an item into a specific form.
chronocycler-reversal=The [entity=prismaris-reversal-chronocycler] works as an alternative to the [entity=recycler]. It is slower, but has an innate productivity bonus to allow recovering more of the original materials. It is also the only way to recycle items native to Prismaris.\n\nMod settings provides two options for the reversal chronocycler:\n- Simple Reversal produces exactly the same results as the Recycler.\n- Complex reversal mostly functions the same way, but if given an item that results from a spoilage process, it undoes the spoiling process and produces an item that it could have come from. For example, [item=spoilage] could randomly become [item=jelly], [item=jellynut], [item=yumako-mash], [item=yumako], [item=nutrients], [item=bioflux], or [item=raw-fish], with the probabilities depending inversely on the length of the spoil time. This also works with modded items. Science packs are deliberately excluded from this process.
thermal-flux=The [entity=prismaris-thermal-flux-furnace] is an upgrade to the [entity=electric-furnace], powered by heat instead of electricity. It can also process [item=prismaris-ferric-shard], [item=prismaris-cupric-shard], and [item=prismaris-lithic-shard] better than the [entity=assembling-machine-3]. It has a 25% productivity bonus and 6 module slots.\n\nThe [entity=prismaris-electric-heater] can supply heat power without needing burnable fuel and can radiate heat in a large area on frozen worlds like [planet=aquilo]. The energy usage scales with demand, but slight inefficiencies means it cannot generate enough power from [fluid=steam] to power itself.
cogitor=(W.I.P.)

