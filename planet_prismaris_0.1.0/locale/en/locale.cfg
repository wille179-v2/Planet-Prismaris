[entity-description]
prismaris-crystal-separator=Separates prismatic and aether crystals into their many ever-shifting pieces.
prismaris-reversal-chronocycler-simple=Like the [entity=recycler], the reversal chronocycler undoes most processes except smelting and chemistry. It returns a slightly larger proportion of the original non-fluid ingredients on average compared to the recycler, and has a small innate chance of increasing their quality. It is the only machine capable of recycling many of Prismaris's resources.
prismaris-reversal-chronocycler-complex=Like the [entity=recycler], the reversal chronocycler undoes most processes except smelting and chemistry. It has a chance of returning bonus products and of increasing their quality compared to the recycler, but can produce unexpected results when fed [item=spoilage] or similar byproducts. It is the only machine capable of recycling many of Prismaris's resources.
prismaris-stasis-chronocycler-refresh=The stasis chronocycler takes in any item that can spoil and resets its spoil percentage back to 100%.
prismaris-stasis-chronocycler-freeze=The stasis chronocycler takes in any item that can spoil and slows down the flow of time by 100x. Putting a slowed item in again will reverse this process, allowing it to be used again.
prismaris-acceleration-chronocycler=The acceleration chronocycler takes in any item that can spoil and immediately makes it spoil. About 20% of the items accelerated vanish (leaving only 80% of the spoil products), but some more complex items can be accelerated without risk.
prismaris-lunar-panel=Attuned to the energy of the moon and stars, lunar panels produce energy at night instead of during the day.
prismaris-void-beacon=A more powerful version of the standard beacon, which can now also broadcast productivity and quality effects.
prismaris-cogitor=Using special catalytic crystals, the cogitor can convert one type of science pack into another, with a very high chance of increasing the science pack's quality. The catalytic crystals are always [quality=normal].
prismaris-electric-heater=Generates heat from an electric current and radiates it both to connected heat pipes and to a large area around itself. The heater scales its power usage based on the heat demand, but internal inefficiencies make it constantly waste a small amount of energy.
prismaris-fire-laser-turret=Inflicts fire damage.
prismaris-explosion-laser-turret=Inflicts explosion damage.
prismaris-acid-laser-turret=Inflicts acid damage.
prismaris-poison-laser-turret=Inflicts poison damage.
prismaris-electric-laser-turret=Inflicts electric damage.
prismaris-physical-laser-turret=Inflicts physical damage.


