[technology-description]
planet-discovery-prismaris=Planet discovery Prismaris
prismatic-separation=Separate [item=prismaris-prismatic-shard] into its many colorful variants to later recombine them into useful items.
prismatic-synthesis=Combine the many shards derived from [item=prismaris-prismatic-shard] into [item=prismaris-ferric-shard], [item=prismaris-cupric-shard], and [item=prismaris-lithic-shard] to craft basic resources.
aethric-cultivation=Separate [item=prismaris-aethric-shard] into its many near-identical variants, some of which can be replanted to regrow [entity=prismaris-cultivated-aether-crystal] by an [entity=agricultural-tower].
aethric-destabilization=Destabilize the crystals derived from the [item=prismaris-aethric-shard], allowing them to decay into various organic or petrochemical materials.
entropic-sea-filtering=Filter [fluid=prismaris-liquid-entropy] to extract [fluid=water] and [item=prismaris-raw-entropic-dust-positive], a useful catalyst and fuel precursor.
void-essence-refining=Refine [fluid=prismaris-raw-void-essence] into [fluid=prismaris-concentrated-void-essence] to power a number of time-bending machines and eventually conjure more matter from nothing through heightened productivity.
void-essence-stabilization=Unfortunately, [fluid=prismaris-concentrated-void-essence] turns into [fluid=prismaris-distorted-void-essence] after use. [item=prismaris-refined-entropic-dust-positive] can be used to stabilize and concentrate it once more. This process loses 20% of the void essence with each step unless productivity modules are used.
flux-capacitor=The [item=prismaris-active-flux-capacitor] is a critical component in time-manipulation technology.
green-polyphasic-science-pack=Like Gleba's agricultural science pack, the [item=prismaris-green-polyphasic-science-pack] can spoil... into its red and blue variants. It will eventually return back to its green phase given enough time. It can be crafted in the [entity=chemical-plant] or the [entity=biochamber].
red-polyphasic-science-pack=The [item=prismaris-red-polyphasic-science-pack] can now be crafted directly, and is crafted in the [entity=foundry] instead of the [entity=biochamber]. The red variant is twice as expensive in terms of fluid usage and is slower to craft than the green variant.
blue-polyphasic-science-pack=The [item=prismaris-blue-polyphasic-science-pack] can now be crafted directly, and is crafted in the [entity=electromagnetic-plant] instead of the [entity=biochamber]. The blue variant is half as expensive in terms of fluid usage, but is still slower to craft than the green variant. 
complete-polyphasic-science=Complete mastery of polyphasic science has been achieved. From here, true mastery of time and space awaits...
entropic-nurturing=[item=prismaris-refined-entropic-dust-positive] can be converted into [item=prismaris-entropic-nutrients] to feed the [entity=biochamber]. These entropic nutrients produce a byproduct that can easily be re-processed back into more entropic nutruents, allowing your biochambers to have an indefinitely self-sustaining food supply anywhere in the solar system.
lunar-panels=Harvesting and amplifying the energy within moonlight through time-bending processes, the [entity=prismaris-lunar-panel] produces electricity at night instead of during the day.
chronocycler-core=Behind the Cogitor, the Chronocycler is the second most powerful piece of time-bending technology. Unfortunately, without first being configured through additional processes, its little more than a useless lump of metal. The chronocycler, once configured, will use [fluid=prismaris-concentrated-void-essence] as fuel and produce [fluid=prismaris-distorted-void-essence] as a byproduct.
chronocycler-acceleration=Now configured to accelerate the flow of time, the Chronocycler will instantly rot and spoil any item placed inside of it. On Gleba, this will mostly result in instant spoilage, but on Prismaris polyphasic items will immediately advance to their next stage in the cycle. WARNING: EXTREMELY DANGEROUS! NOT SAFE FOR USE ON LIVING CREATURES!
chronocycler-stasis=Now configured to halt the flow of time, the chronocycler will instantly reset the spoil percentage of any item placed into it back to 100%. (Note: In a future update, this functionality may change.)
chronocycler-reversal=Now configured to reverse the flow of time, the chronocycler will revert an item to how it was before it was made. In practice, this functions similar to the [entity=recycler], except the chronocycler in this mode has a small innate quality and productivity bonus compared to Fulgora's recycler, at the cost of being slower. Additionally, the chronocycler in this configuration is the only way to recycle items native to Prismaris, which cannot be recycled at all normally.
prismaris-bonus-worker-robots-speed=Increases the flying speed of logistic and construction robots by a large amount thanks to a better understanding of time.
prismatic-tesla-turret=Distortions of temporal phase allow you to construct [entity=tesla-turret] that deal damage types other than electric damage, for targets with unusually high electric resistance.
prismatic-laser-turret=Distortions of temporal phase allow you to construct [entity=laser-turret] that deal damage types other than laser damage, for targets with unusually high laser resistance.
cogitor=The Cogitor is the pinnacle of time-manipulation technology. Using special catalytic crystals, you can transmute one type of science pack into another with an extremely high innate chance of increasing its quality in the process. The catalytic crystals are not consumed in this process, but do require an extraordinarily long time to recharge after use. Fortunately, you already have the tools to fix that.
cogitor-alien-science=Further experimentation allows the Cogitor to process the scientific insight of Gleba, Fulgora, and Vulcanus.
cogitor-promethium-science=Even further experimentation now allows the Cogitor to the most advanced scientific knowledge of Aquilo and deep space.
void-beacon=The void beacon is a massively upgraded version of the [entity=beacon], which can cover a larger area, use more modules, and can now broadcast the effects of quality and productivity modules. However, it has a significantly higher energy cost. (Note: Once certain dependancy mods are updated to factorio 2.1, the void beacon will be changing to require a supply of concentrated void fluid as fuel instead.)
prismaris-bonus-lab-speed=Accelerate the speed of laboratories using knowledge of time manipulation.
prismaris-bonus-lab-productivity=Use void energy to slightly increase the amount of research progress per consumed science pack.
metallurgic-productivity=Increases productivity for molten iron and molten copper recipes.
holmium-productivity=Increases productivity for holmium solution.
bioflux-productivity=Increases productivity for bioflux.
thermal-flux=Energy can change just as freely as matter on Prismaris, and even more freely elsewhere. You can now use the power of energy conversion to better process prismaris's resources and the mineral resources of the rest of the solar system.

