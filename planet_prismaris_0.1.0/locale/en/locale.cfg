[string-mod-setting-description]
prismaris-dust-mode-default-mode=Refined entropic dust(+) stays refined when it spoils to negative, but becomes raw again when burnt or consumed.
prismaris-dust-mode-collapse-mode=Refined entropic dust(+) always becomes raw after burning, consuming, or spoiling and always needs to be re-refined.
prismaris-dust-mode-preserve-mode=Once refined, Refined entropic dust(+) stays refined even after burning, consuming, or spoiling and needs no further processing.
prismaris-rock-candy-inedible=[color=#ff3333][Hard][/color] Aethric crystals are just items.
prismaris-rock-candy-candy=[color=#ffff33][Medium][/color] Aethric crystals can be consumed by the player to heal.
prismaris-rock-candy-candy-and-nutrients=[color=#33ff33][Easy][/color] Aethric crystals can be consumed by the player or by the biochamber as a non-perishable but low-energy nutrient supply.
test-stasis-mode-refresh=Refresh mode resets the spoilage timer on an item, but otherwise leaves it unchanged.
test-stasis-mode-freeze=Freeze mode creates new "frozen" items with a much longer spoil timer, but they must be unfrozen by another stasis chronocycler before they can be used again.
test-reversal-mode-simple=The reversal chronocycler produces the same results as a vanilla recycler.
test-reversal-mode-complex=When given an item that spoils from something else, it produces a random assortment of items based on what could spoil into it. For example, spoilage can be reversed into nutrients, jelly, yumako mash, etc. Items with longer spoil times are more unlikely to be returned.
prismaris-science-phase-randomized=Only one polyphasic science pack is required for endgame research, but its phase is chosen randomly per technology, which may demand specialized infrastructure around your labs.
prismaris-science-phase-all=All three phases of the polyphasic science are required, demanding triple the production of polyphasic science relative to other science packs.
prismaris-science-phase-all-balanced=All three phases of the polyphasic science pack are required, but technology research times and pack quantities are rebalanced to keep overall science pack consumption equal. This may cause conflicts with other mods.
prismaris-science-phase-rainbow=Adds a single "rainbow science pack," created out of the three polyphasic science packs. Ideal for saves with many modded planets or additional science packs. Multi-planet modpacks may force-enable this option to streamline progression. 

