[mod-setting-description]
prismaris-lightning-targets-robots=Lightninng on Prismaris is strongly attracted to robots, and logistics robots may even be struck despite being near lightning rods (lightning attractors still provide full protection). Disabling this setting makes lightning behave exactly as it does on Fulgora.
prismaris-add-polysci-to-endgame=Polyphasic science packs are required for Aquilo technology and beyond.
prismaris-randomized-science-phase=If enabled, every endgame science requires three copies of a single randomly chosen polyphasic science pack, rather than one of each. Has no effect if "Add polyphasic science to endgame research" is disabled.
prismaris-easy-endgame-science-rescaling=If enabled, reduces the demand for polyphasic science packs to be on par with other planetary science packs, rather than requiring 3x as many. Has no effect if "Randomized Science Pack phase" is disabled.
test-stasis-mode=For alpha-testing only. Toggles between two different modes of functionality for the Chronocycler in stasis mode. Changing this setting may cause preserved items to vanish.
test-reversal-mode=For alpha-testing only. Toggles between two different modes of functionality for the Chronocycler in reversal mode. For most items, this has no effect; it only changes the result of putting spoilage and similar post-spoil items into a chronocycler.

[string-mod-setting]
test-stasis-mode-refresh=Refresh mode
test-stasis-mode-freeze=Freeze mode
test-reversal-mode-simple=Simple reversal
test-reversal-mode-complex=Complex reversal

[string-mod-setting-description]
test-stasis-mode-refresh=Refresh mode resets the spoilage timer on an item, but otherwise leaves it unchanged.
test-stasis-mode-freeze=Freeze mode creates new "frozen" items with a much longer spoil timer, but they must be unfrozen by another stasis chronocycler before they can be used again.
test-reversal-mode-simple=The reversal chronocycler produces the same results as a vanilla recycler.
test-reversal-mode-complex=When given an item that spoils from something else, it produces a random assortment of items based on what could spoil into it. For example, spoilage can be reversed into nutrients, jelly, yumako mash, etc. Items with longer spoil times are more unlikely to be returned.

