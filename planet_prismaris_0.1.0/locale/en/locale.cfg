[factoriopedia-description]
prismaris-activated-prismatic-shard-r=Cycles through [item=prismaris-activated-prismatic-shard-r], [item=prismaris-activated-prismatic-shard-g], [item=prismaris-activated-prismatic-shard-b], & [item=prismaris-activated-prismatic-shard-w].
prismaris-activated-prismatic-shard-g=Cycles through [item=prismaris-activated-prismatic-shard-r], [item=prismaris-activated-prismatic-shard-g], [item=prismaris-activated-prismatic-shard-b], & [item=prismaris-activated-prismatic-shard-w].
prismaris-activated-prismatic-shard-b=Cycles through [item=prismaris-activated-prismatic-shard-r], [item=prismaris-activated-prismatic-shard-g], [item=prismaris-activated-prismatic-shard-b], & [item=prismaris-activated-prismatic-shard-w].
prismaris-activated-prismatic-shard-w=Cycles through [item=prismaris-activated-prismatic-shard-r], [item=prismaris-activated-prismatic-shard-g], [item=prismaris-activated-prismatic-shard-b], & [item=prismaris-activated-prismatic-shard-w].
prismaris-activated-prismatic-shard-c=Cycles through [item=prismaris-activated-prismatic-shard-c], [item=prismaris-activated-prismatic-shard-m], [item=prismaris-activated-prismatic-shard-y], & [item=prismaris-activated-prismatic-shard-k].
prismaris-activated-prismatic-shard-m=Cycles through [item=prismaris-activated-prismatic-shard-c], [item=prismaris-activated-prismatic-shard-m], [item=prismaris-activated-prismatic-shard-y], & [item=prismaris-activated-prismatic-shard-k].
prismaris-activated-prismatic-shard-y=Cycles through [item=prismaris-activated-prismatic-shard-c], [item=prismaris-activated-prismatic-shard-m], [item=prismaris-activated-prismatic-shard-y], & [item=prismaris-activated-prismatic-shard-k].
prismaris-activated-prismatic-shard-k=Cycles through [item=prismaris-activated-prismatic-shard-c], [item=prismaris-activated-prismatic-shard-m], [item=prismaris-activated-prismatic-shard-y], & [item=prismaris-activated-prismatic-shard-k].
prismaris-shattered-aethric-shard-f=Cycles through six near-identical variants. Can be planted to grow [entity=prismaris-cultivated-aether-crystal].
prismaris-raw-entropic-dust-positive=Only [item=prismaris-raw-entropic-dust-positive] can be smelted into [item=prismaris-refined-entropic-dust-positive].
prismaris-raw-entropic-dust-negative=Only [item=prismaris-raw-entropic-dust-positive] can be smelted into [item=prismaris-refined-entropic-dust-positive].
prismaris-refined-entropic-dust-positive=Only [item=prismaris-refined-entropic-dust-positive] can be used in industrial processes. If burnt as fuel, produces [item=prismaris-raw-entropic-dust-negative] as a byproduct instead of [item=prismaris-refined-entropic-dust-negative].
prismaris-refined-entropic-dust-negative=Only [item=prismaris-refined-entropic-dust-positive] can be used in industrial processes.

